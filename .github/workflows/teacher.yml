name: Teacher trajectories (SFT warm-start)

# A stronger open model (default: Qwen3 235B Instruct on OpenRouter) drives Harbor's terminus-2 agent through the
# secret training tasks, so its good runs can teach Qwen3 4B to use the environment. This costs money. The run
# refuses a model above the price ceiling in harbortask/teacher.py, and each shard checks its share of the budget
# before every task.
#
# The trajectories reveal training answers, so the logs show only rewards and turn counts, and the trials and the
# SFT file are kept as an artifact encrypted with TTUNE_TRAIN_SEED. The PR carries aggregate numbers only.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Teacher model on OpenRouter (license must allow training on its outputs)"
        required: false
        default: qwen/qwen3-235b-a22b-2507
      start:
        description: "First training case (0-999)"
        required: false
        default: "0"
      limit:
        description: "How many training cases from start"
        required: false
        default: "50"
      shards:
        description: "Parallel jobs"
        required: false
        default: "5"
      budget_usd:
        description: "Hard spending cap for this run, in USD (split evenly across shards)"
        required: true
        default: "2"
      max_turns:
        description: "Agent turns per task"
        required: false
        default: "40"
      agent_timeout_minutes:
        description: "Time the agent gets per task"
        required: false
        default: "20"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: teacher
  cancel-in-progress: false

env:
  HARBOR: "0.25.0"
  N_TRAIN: "1000"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.plan.outputs.run_id }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_budget: ${{ steps.plan.outputs.shard_budget }}
      prices: ${{ steps.price.outputs.prices }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: plan
        env:
          START: ${{ inputs.start }}
          LIMIT: ${{ inputs.limit }}
          SHARDS: ${{ inputs.shards }}
          BUDGET: ${{ inputs.budget_usd }}
          TURNS: ${{ inputs.max_turns }}
          MINUTES: ${{ inputs.agent_timeout_minutes }}
          MODEL: ${{ inputs.model }}
        run: |
          for v in "$START" "$LIMIT" "$SHARDS" "$TURNS" "$MINUTES"; do
            case "$v" in ''|*[!0-9]*) echo "start, limit, shards, max_turns and agent_timeout_minutes must be numbers"; exit 1;; esac
          done
          if [ $((START + LIMIT)) -gt "$N_TRAIN" ]; then echo "start + limit must be at most $N_TRAIN"; exit 1; fi
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 40 ]; then echo "shards must be 1-40"; exit 1; fi
          python3 - "$BUDGET" "$SHARDS" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          budget, shards = float(sys.argv[1]), int(sys.argv[2])
          if not 0 < budget <= 30:
              sys.exit("budget_usd must be more than 0 and at most 30")
          print(f"shard_budget={budget / shards:.4f}")
          PY
          slug=$(echo "$MODEL" | tr -c 'A-Za-z0-9.\n-' '-' | tr 'A-Z' 'a-z')
          echo "run_id=$(date -u +%Y%m%d-%H%M)-teacher-${slug}-s${START}-n${LIMIT}" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$SHARDS")" >> "$GITHUB_OUTPUT"

      - run: pip install -r requirements.txt

      - name: The teacher's price is under the ceiling
        id: price
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python -m harbortask teacher price --model "$MODEL" --out prices.json
          echo "prices=$(cat prices.json)" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      TTUNE_TRAIN_SEED: ${{ secrets.TTUNE_TRAIN_SEED }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL: ${{ inputs.model }}
      START: ${{ inputs.start }}
      LIMIT: ${{ inputs.limit }}
      SHARDS: ${{ inputs.shards }}
      SHARD: ${{ matrix.shard }}
      TURNS: ${{ inputs.max_turns }}
      MINUTES: ${{ inputs.agent_timeout_minutes }}
      BUDGET: ${{ needs.plan.outputs.shard_budget }}
      PRICES: ${{ needs.plan.outputs.prices }}
    steps:
      - name: The secrets are set
        run: |
          [ -n "$TTUNE_TRAIN_SEED" ] || { echo "TTUNE_TRAIN_SEED is not set"; exit 1; }
          [ -n "$OPENROUTER_API_KEY" ] || { echo "OPENROUTER_API_KEY is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-envgen.txt
            requirements-docgen.txt

      - run: pip install -r requirements-envgen.txt -r requirements-docgen.txt

      - name: Build this shard's training tasks
        run: |
          mkdir -p build
          python -m harbortask agentic pick --split train --n-cases "$N_TRAIN" --start "$START" --limit "$LIMIT" \
            --shard "$SHARD/$SHARDS" --out build/tasks > build/tasks.txt
          echo "$(wc -l < build/tasks.txt) tasks"
          echo "$PRICES" > prices.json

      - name: Install Harbor
        run: |
          curl -LsSf https://astral.sh/uv/0.9.7/install.sh | sh
          ~/.local/bin/uv tool install "harbor==$HARBOR"

      - name: Run the teacher on each task
        run: |
          mkdir -p jobs
          deadline=$(( $(date +%s) + (330 - MINUTES - 25) * 60 ))
          multiplier=$(python3 -c "print(int('$MINUTES') * 60 / 900)")
          info=$(python3 -c "import json; p=json.load(open('prices.json')); print(json.dumps({'max_input_tokens': 131072, 'max_output_tokens': 16384, 'input_cost_per_token': p['input'], 'output_cost_per_token': p['output']}))")
          api_errors=0
          for task in build/tasks/*/; do
            name=$(basename "$task")
            if [ "$(date +%s)" -gt "$deadline" ]; then echo "out of time: $name and later tasks not run"; break; fi
            if [ "$api_errors" -ge 2 ]; then echo "two API errors in a row: stopping; $name and later tasks not run"; break; fi
            python -m harbortask teacher can-start --jobs jobs --prices prices.json --budget "$BUDGET" \
              || { echo "budget reached: $name and later tasks not run"; break; }
            timeout --kill-after=60 "$(( (MINUTES + 15) * 60 ))" \
            harbor run -p "$task" -a terminus-2 -m "openrouter/$MODEL" --skip-credential-checks \
              --ak temperature=0 --ak "max_turns=$TURNS" --ak store_all_messages=true \
              --ak record_terminal_session=false --ak "model_info=$info" \
              --agent-timeout-multiplier "$multiplier" -e docker -n 1 -o "jobs/$name" -y -q \
              > "jobs/$name.harbor.log" 2>&1 \
              || { echo "harbor exited with $? on $name"; docker ps -aq | xargs -r docker rm -f > /dev/null; }
            # Public log: rewards, turn counts and the kind of error only. Harbor's own output (which can quote the
            # model and the API's error text) stays in jobs/, which is encrypted below.
            if python3 - "$name" <<'PY'
          import json, pathlib, sys
          name, api_error = sys.argv[1], False
          for p in pathlib.Path("jobs", name).rglob("result.json"):
              r = json.loads(p.read_text())
              if "trial_name" in r:
                  reward = ((r.get("verifier_result") or {}).get("rewards") or {}).get("reward")
                  turns = ((r.get("agent_result") or {}).get("metadata") or {}).get("n_episodes")
                  exc = (r.get("exception_info") or {}).get("exception_type")
                  log = pathlib.Path("jobs", f"{name}.harbor.log")
                  text = log.read_text(errors="replace") if log.is_file() else ""
                  why = " (out of OpenRouter credits: HTTP 402)" if "requires more credits" in text else ""
                  print(f"{name}: reward={reward} turns={turns} exception={exc}{why}")
                  api_error = api_error or (exc == "APIError" and reward is None)
          sys.exit(4 if api_error else 0)
          PY
            then api_errors=0; else api_errors=$((api_errors + 1)); fi
          done
          python -m harbortask teacher can-start --jobs jobs --prices prices.json --budget "$BUDGET" || true

      - name: Encrypt this shard's trials
        if: always()
        run: |
          [ -d jobs ] || exit 0
          tar -czf - jobs | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:TTUNE_TRAIN_SEED \
            -out "shard-$SHARD.tar.gz.enc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.tar.gz.enc
          retention-days: 7
          if-no-files-found: ignore

  merge:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    env:
      TTUNE_TRAIN_SEED: ${{ secrets.TTUNE_TRAIN_SEED }}
      RUN_ID: ${{ needs.plan.outputs.run_id }}
      MODEL: ${{ inputs.model }}
      PRICES: ${{ needs.plan.outputs.prices }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: parts

      - name: Decrypt, summarize and build the SFT file
        id: summary
        run: |
          mkdir -p all
          for f in parts/*/shard-*.tar.gz.enc; do
            k=$(basename "$f" .tar.gz.enc)
            mkdir -p "all/$k"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:TTUNE_TRAIN_SEED -in "$f" | tar -xzf - -C "all/$k"
          done
          echo "$PRICES" > prices.json
          python -m harbortask teacher summary --jobs all/*/jobs --prices prices.json --model "$MODEL" \
            --out "sft/teacher/$RUN_ID.md"
          python -m harbortask teacher sft --jobs all/*/jobs --out bundle/sft.jsonl
          cp -r all bundle/trials
          tar -czf - bundle | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:TTUNE_TRAIN_SEED \
            -out ttune-teacher.tar.gz.enc
          cat "sft/teacher/$RUN_ID.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.summary.outcome == 'success'
        with:
          name: ttune-teacher-${{ needs.plan.outputs.run_id }}
          path: ttune-teacher.tar.gz.enc
          retention-days: 90

      - name: Move to the latest main
        if: steps.summary.outcome == 'success'
        run: git fetch origin main && git checkout -B main origin/main

      - name: Open pull request
        if: steps.summary.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: teacher/${{ needs.plan.outputs.run_id }}
          add-paths: sft/teacher/${{ needs.plan.outputs.run_id }}.md
          commit-message: "Teacher trajectories: ${{ inputs.model }} (${{ needs.plan.outputs.run_id }})"
          title: "Teacher trajectories: ${{ inputs.model }} (${{ needs.plan.outputs.run_id }})"
          body-path: sft/teacher/${{ needs.plan.outputs.run_id }}.md
          delete-branch: true
