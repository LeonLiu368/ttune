name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt -r requirements-docgen.txt

      - run: python -m pytest -q

  # Household generator and document truth tests that need PolicyEngine (skipped in the job above).
  envgen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-envgen.txt

      - run: pip install -r requirements-dev.txt -r requirements-envgen.txt -r requirements-docgen.txt

      - run: python -m pytest -q tests/test_envgen_truth.py tests/test_docgen_truth.py tests/test_harbortask_calc.py
