name: Baseline (Harbor agent, self-hosted model)

# The agentic baseline: an open model, served by llama.cpp on the runner's CPU, drives Harbor's terminus-2 agent
# through the holdout tasks (the published 200 ID + 200 OOD document cases, never trained on). Each task runs in
# Docker with no network: the agent reads the PDFs, runs benefits-calc and writes /app/answer.json, and the task's
# separate verifier scores it. No API, no tokens bought, $0. A final job scores every trial like the one-shot evals
# (python -m harbortask agentic collect), compares and opens a PR.
on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Model (presets in evals/local_models.json)"
        type: choice
        options: [qwen3-4b-instruct, llama-3.1-8b-instruct, gemma-3-4b-it]
        default: qwen3-4b-instruct
      model_repo:
        description: "Optional: a Hugging Face repo (owner/name) with a GGUF fine-tuned from the preset, used in its place. A private repo needs the HF_TOKEN secret."
        required: false
        default: ""
      limit:
        description: 'Tasks per holdout set, or "all" for all 200'
        required: false
        default: "5"
      shards:
        description: "Parallel jobs (each runs every N-th task of both sets; up to 20 run at once)"
        required: false
        default: "1"
      agent_timeout_minutes:
        description: "Time the agent gets per task"
        required: false
        default: "30"
      max_turns:
        description: "Agent turns per task"
        required: false
        default: "40"
      compare_to:
        description: "The evals run to compare with, e.g. the base model's baseline when evaluating a fine-tuned model"
        required: false
        default: "20261031-0030-local-qwen3-4b-instruct-docs"
      rerun_shards:
        description: 'Only these shards, e.g. "12,20", to redo the ones an earlier run lost; needs resume_run'
        required: false
        default: ""
      resume_run:
        description: "The earlier Baseline run (its numeric id) whose other shards complete this one; use the same shards and limit"
        required: false
        default: ""

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: baseline
  cancel-in-progress: false

env:
  HARBOR: "0.25.0"
  CONTEXT: "32768"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.plan.outputs.run_id }}
      name: ${{ steps.plan.outputs.name }}
      shards: ${{ steps.plan.outputs.shards }}
      limit: ${{ steps.plan.outputs.limit }}
      rerun: ${{ steps.plan.outputs.rerun }}
    steps:
      - id: plan
        env:
          PRESET: ${{ inputs.preset }}
          MODEL_REPO: ${{ inputs.model_repo }}
          LIMIT: ${{ inputs.limit }}
          SHARDS: ${{ inputs.shards }}
          MINUTES: ${{ inputs.agent_timeout_minutes }}
          TURNS: ${{ inputs.max_turns }}
          COMPARE_TO: ${{ inputs.compare_to }}
          RERUN: ${{ inputs.rerun_shards }}
          RESUME: ${{ inputs.resume_run }}
        run: |
          if [ "$LIMIT" = "all" ]; then LIMIT=""; fi
          case "$LIMIT" in *[!0-9]*) echo 'limit must be a number or "all"'; exit 1;; esac
          for v in "$SHARDS" "$MINUTES" "$TURNS"; do
            case "$v" in ''|*[!0-9]*) echo "shards, agent_timeout_minutes and max_turns must be numbers"; exit 1;; esac
          done
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 60 ]; then echo "shards must be 1-60"; exit 1; fi
          if [ "$MINUTES" -lt 5 ] || [ "$MINUTES" -gt 60 ]; then echo "agent_timeout_minutes must be 5-60"; exit 1; fi
          if [ -n "$MODEL_REPO" ]; then
            if ! [[ "$MODEL_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || [[ "$MODEL_REPO" == *..* ]]; then
              echo "model_repo must be a Hugging Face repo id, owner/name"; exit 1
            fi
            NAME=$(printf '%s' "${MODEL_REPO#*/}" | tr '[:upper:]' '[:lower:]')
          else
            NAME="$PRESET"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          case "$COMPARE_TO" in ''|*[!A-Za-z0-9_.-]*|*..*) echo "compare_to must be a run id in evals/results/"; exit 1;; esac
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "run_id=$(date -u +%Y%m%d-%H%M)-harbor-${NAME}${LIMIT:+-n$LIMIT}" >> "$GITHUB_OUTPUT"
          # A rerun: only the listed shards, with the earlier run's other shards merged in at the end.
          python3 - "$SHARDS" "$RERUN" "$RESUME" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          n, rerun, resume = int(sys.argv[1]), sys.argv[2].replace(" ", ""), sys.argv[3].strip()
          if bool(rerun) != bool(resume):
              sys.exit("rerun_shards and resume_run go together")
          if resume and not re.fullmatch(r"[0-9]{1,20}", resume):
              sys.exit("resume_run must be a run's numeric id")
          if rerun and not re.fullmatch(r"[0-9]+(,[0-9]+)*", rerun):
              sys.exit('rerun_shards must look like "12,20"')
          shards = sorted({int(k) for k in rerun.split(",")}) if rerun else list(range(n))
          if any(k >= n for k in shards):
              sys.exit(f"rerun_shards must be below shards ({n})")
          print(f"shards={json.dumps(shards)}")
          print(f"rerun={','.join(map(str, shards)) if rerun else ''}")
          PY

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      PRESET: ${{ inputs.preset }}
      MODEL_REPO: ${{ inputs.model_repo }}
      NAME: ${{ needs.plan.outputs.name }}
      LIMIT: ${{ needs.plan.outputs.limit }}
      SHARDS: ${{ inputs.shards }}
      SHARD: ${{ matrix.shard }}
      MINUTES: ${{ inputs.agent_timeout_minutes }}
      TURNS: ${{ inputs.max_turns }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-local-llm.txt
            requirements-docgen.txt

      - name: Install the llama.cpp server and the task builder
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
        run: pip install -r requirements-local-llm.txt -r requirements-docgen.txt

      - name: Build this shard's tasks
        run: |
          mkdir -p build
          args=(--out build/tasks --shard "$SHARD/$SHARDS")
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python -m harbortask agentic pick "${args[@]}" | tee build/tasks.txt
          echo "$(wc -l < build/tasks.txt) tasks"

      - name: Install Harbor
        run: |
          curl -LsSf https://astral.sh/uv/0.9.7/install.sh | sh
          ~/.local/bin/uv tool install "harbor==$HARBOR"

      - name: Resolve the model on Hugging Face
        id: model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m evals model resolve "$PRESET" ${MODEL_REPO:+--repo "$MODEL_REPO"} --github-output "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: models
          key: model-${{ steps.model.outputs.sha256 }}

      - name: Download and verify the model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m evals model fetch "$PRESET" ${MODEL_REPO:+--repo "$MODEL_REPO"} --models-dir models

      - name: Start the model server
        env:
          FILE: ${{ steps.model.outputs.file }}
        run: .github/scripts/llama-server.sh "models/$FILE" "local/$NAME" "$CONTEXT"

      - name: Run the agent on each task
        env:
          # The local server takes any key; LiteLLM just needs one set.
          OPENAI_API_KEY: sk-local-no-key
          FILE: ${{ steps.model.outputs.file }}
        run: |
          mkdir -p jobs
          # Stop starting tasks once one more might not fit in the job's 350 minutes.
          deadline=$(( $(date +%s) + (330 - MINUTES - 25) * 60 ))
          multiplier=$(python3 -c "print(int('$MINUTES') * 60 / 900)")  # tasks set 900 s
          info="{\"max_input_tokens\": $((CONTEXT - 4096)), \"max_output_tokens\": 4096, \"input_cost_per_token\": 0, \"output_cost_per_token\": 0}"
          for task in build/tasks/*/; do
            name=$(basename "$task")
            if [ "$(date +%s)" -gt "$deadline" ]; then echo "out of time: $name and later tasks not run"; break; fi
            # A hard stop past the agent's own timeout, so one stuck trial can't take the whole shard with it.
            timeout --kill-after=60 "$(( (MINUTES + 15) * 60 ))" \
            harbor run -p "$task" -a terminus-2 -m "openai/local/$NAME" \
              --ak api_base=http://127.0.0.1:8000/v1 --ak temperature=0 --ak "max_turns=$TURNS" \
              --ak record_terminal_session=false --ak "model_info=$info" --ak 'llm_kwargs={"max_tokens": 4096}' \
              --agent-timeout-multiplier "$multiplier" -e docker -n 1 -o "jobs/$name" -y -q \
              || { echo "harbor exited with $? on $name"; docker ps -aq | xargs -r docker rm -f > /dev/null; }
            python -m harbortask agentic show "jobs/$name" || true
            free -m | head -2; ps -o rss=,comm= -C python,python3,harbor,dockerd | sort -rn | head -3
            # The model server must answer before the next task. An agent that timed out can leave it generating
            # a reply nobody reads, and it answers nothing else meanwhile: restart it rather than wait.
            if ! curl -sf --max-time 10 http://127.0.0.1:8000/v1/models > /dev/null; then
              echo "model server not answering after $name; restarting it"
              .github/scripts/llama-server.sh "models/$FILE" "local/$NAME" "$CONTEXT" || { echo "model server is down"; exit 1; }
            fi
          done
          cp models/model.json jobs/model.json

      - name: Server log
        if: failure()
        run: tail -100 server.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: jobs
          if-no-files-found: ignore

  merge:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ needs.plan.outputs.run_id }}
      LIMIT: ${{ needs.plan.outputs.limit }}
      NAME: ${{ needs.plan.outputs.name }}
      COMPARE_TO: ${{ inputs.compare_to }}
      MINUTES: ${{ inputs.agent_timeout_minutes }}
      TURNS: ${{ inputs.max_turns }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-docgen.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: parts

      - uses: actions/download-artifact@v4
        if: inputs.resume_run != ''
        with:
          pattern: shard-*
          path: earlier
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}

      - name: Add the earlier run's other shards
        if: inputs.resume_run != ''
        env:
          RERUN: ${{ needs.plan.outputs.rerun }}
        run: |
          for dir in earlier/shard-*; do
            k=${dir##*-}
            case ",$RERUN," in *",$k,"*) echo "shard $k: rerun";; *) cp -r "$dir" parts/ && echo "shard $k: from the earlier run";; esac
          done

      - name: Score every trial and compare
        id: compare
        run: |
          args=(--jobs parts/shard-* --model "local/$NAME" --base-url http://127.0.0.1:8000/v1
                --max-turns "$TURNS" --agent-timeout-sec "$((MINUTES * 60))" --temperature 0
                --compare-to "$COMPARE_TO")
          info=$(ls parts/shard-*/model.json 2>/dev/null | head -1)
          if [ -n "$info" ]; then args+=(--model-info "$info"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python -m harbortask agentic collect "$RUN_ID" "${args[@]}"
          python -m evals compare "$RUN_ID"
          cat "evals/results/$RUN_ID/comparison.md" >> "$GITHUB_STEP_SUMMARY"

      # The results go on top of today's main: a branch based on the run's older commit would look to GitHub like
      # it changes workflow files, which this token may not do.
      - name: Move to the latest main
        if: steps.compare.outcome == 'success'
        run: git fetch origin main && git checkout -B main origin/main

      - name: Open pull request
        if: steps.compare.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: baseline/${{ needs.plan.outputs.run_id }}
          add-paths: evals/results/${{ needs.plan.outputs.run_id }}
          commit-message: "Baseline: local/${{ needs.plan.outputs.name }} with terminus-2 (${{ needs.plan.outputs.run_id }})"
          title: "Baseline: local/${{ needs.plan.outputs.name }} with terminus-2 (${{ needs.plan.outputs.run_id }})"
          body-path: evals/results/${{ needs.plan.outputs.run_id }}/comparison.md
          delete-branch: true

      - name: Fail if a shard failed
        if: needs.run.result != 'success'
        run: |
          echo "At least one shard failed; tasks it didn't reach are listed as not run in the results."
          exit 1
