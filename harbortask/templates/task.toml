schema_version = "1.4"
artifacts = ["/app/answer.json"]

[task]
name = "ttune/$task_id"
version = "1.0.0"
description = "Screen a household for SNAP, EITC, Medicaid and WIC from its paperwork, with PolicyEngine as a calculator."
keywords = ["benefits", "snap", "eitc", "medicaid", "wic", "policyengine", "documents", "rewardkit"]

[[task.authors]]
name = "Leon Liu"

[metadata]
category = "public-benefits"
difficulty = "$difficulty"
tags = [$tags]
source_case = "$case_id"
households = "$households"
policyengine_us = "$policyengine_us"
periods = { snap = "2026-10", wic = "2026-10", eitc = "2026", medicaid = "2026" }
built_by = "python -m harbortask build"

[agent]
timeout_sec = 900.0
user = "caseworker"

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 180.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
